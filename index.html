<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AVOX AVIATOR - Purple BG Same Plane</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0e0e0e;color:#fff;max-width:430px;margin:0 auto;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#1a1a1a;padding:10px 8px;display:flex;gap:6px;align-items:center;border-radius:0 0 14px 14px}
.pill{padding:8px 18px;border-radius:20px;background:#2c2c2c;color:#888;border:none;font-weight:700;font-size:13px}.pill.active{background:#3a3a3a;color:#fff}
.deposit{margin-left:auto;background:#ffcc00;color:#000;padding:8px 16px;border-radius:20px;font-weight:900;border:none;font-size:13px}
.tournament{margin:8px;background:linear-gradient(90deg,#1e162f,#221a36);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border:1px solid #2a2a4a}
.history{display:flex;gap:6px;padding:6px 8px;overflow-x:auto;white-space:nowrap}
.history span{padding:5px 10px;border-radius:15px;font-size:12px;font-weight:800}.purple{color:#b07cff;background:#241538;border:1px solid #3a2a5a}.blue{color:#4ea8ff;background:#132e4a}
.game{flex:1;margin:6px 8px;background:#000;border-radius:16px;position:relative;overflow:hidden;border:1px solid #222;transition:background 0.4s ease}
#rays{position:absolute;inset:0;transition:all 0.4s ease;opacity:0.9}
#trail{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.logo{position:absolute;top:10px;left:12px;color:#e30613;font-weight:900;font-style:italic;font-size:24px;z-index:5;display:flex;align-items:center;gap:6px}
#mult{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:72px;font-weight:900;z-index:3;letter-spacing:-2px;color:#fff}
#planeWrap{position:absolute;left:0;bottom:0;z-index:4;width:88px;height:44px}
.bets{display:flex;gap:6px;padding:6px}
.panel{flex:1;background:#1e1e20;border-radius:14px;padding:8px;border:1px solid #2a2a2a}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tog{display:flex;background:#0f0f0f;border-radius:16px;padding:2px}.tog button{padding:4px 10px;border-radius:14px;border:none;background:transparent;color:#666;font-size:11px;font-weight:700}.tog button.on{background:#333;color:#fff}
.amtbox{display:flex;align-items:center;background:#0f0f0f;border-radius:20px;padding:3px;border:1px solid #333;margin-bottom:6px}.amtbox button{width:26px;height:26px;border-radius:50%;border:none;background:#2a2a2a;color:#fff}.amtbox input{flex:1;background:transparent;border:none;color:#fff;text-align:center;font-weight:700;font-size:12px;outline:none}
.betbtn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:900;font-size:13px}.green{background:#00e701;color:#000;box-shadow:0 3px 0 #00a501}.yellow{background:#ffcc00;color:#000}.gray{background:#3a3a3a;color:#888}
.quicks{display:flex;gap:4px;margin-top:6px}.quicks button{flex:1;padding:5px;border-radius:12px;background:#0f0f0f;border:1px solid #333;color:#888;font-size:10px}
@keyframes spin{0%{transform:scaleX(0.1)}50%{transform:scaleX(1)}100%{transform:scaleX(0.1)}}.prop{animation:spin 0.07s linear infinite}
</style>
</head>
<body>
<div class="topbar"><button class="pill active">Room 1</button><button class="pill">Room 2</button><button class="deposit">Deposit</button></div>
<div class="tournament"><div><b style="color:#ffeb3b;font-size:13px">🏆 TOURNAMENT</b><div style="font-size:11px;color:#aaa">Weekly prize pool 500,000 KES</div></div><div style="background:#2a2a3a;padding:10px 14px;border-radius:12px;color:#ffcc00;font-size:20px">→</div></div>
<div class="history"><span class="purple">5.41x</span><span class="blue">1.23x</span><span class="purple">8.92x</span><span class="blue">2.07x</span><span class="purple">12.45x</span><span class="blue">1.98x</span><span class="purple">3.64x</span><span class="blue">4.10x</span></div>
<div class="game" id="gameBox">
<div id="rays"></div>
<canvas id="trail"></canvas>
<div class="logo">Aviator</div>
<div id="planeWrap">
<!-- SAME EXACT PLANE AS YOUR SCREENSHOT -->
<svg viewBox="0 0 220 75" width="88" height="44" xmlns="http://www.w3.org/2000/svg">
<g transform="rotate(-6 110 37)">
<path d="M12 32 L4 36 Q2 38 6 40 L32 41 L36 52 Q40 60 85 60 L185 54 Q205 52 205 37 Q205 22 185 20 L85 14 Q40 12 32 22 L28 32 Z" fill="#E30613"/>
<ellipse cx="102" cy="16" rx="58" ry="8.5" fill="#E30613"/>
<ellipse cx="105" cy="56" rx="56" ry="8.5" fill="#E30613"/>
<path d="M108 20 L128 18 L138 22 L135 32 L110 34 Z" fill="#ffffff" stroke="#222" stroke-width="0.6"/>
<path d="M140 22 L158 24 L162 28 L155 33 L138 31 Z" fill="#7ec8ff" stroke="#222" stroke-width="0.6"/>
<g class="prop"><ellipse cx="208" cy="37" rx="3.5" ry="26" fill="#ff1a2a"/></g>
<ellipse cx="208" cy="37" rx="6" ry="4" fill="#b0000a"/>
</g>
</svg>
</div>
<div id="mult">1.00x</div>
</div>
<div class="bets">
<div class="panel"><div class="head"><small>Bet</small><div class="tog"><button class="on">Bet</button><button>Auto</button></div></div><div class="amtbox"><button onclick="chg(1,-10)">−</button><input id="a1" value="20.00 KES"><button onclick="chg(1,10)">+</button></div><button class="betbtn green" id="btn1">Bet 20.00 KES</button><div class="quicks"><button>100</button><button>200</button><button>500</button><button>10000</button></div></div>
<div class="panel"><div class="head"><small>Bet</small><div class="tog"><button class="on">Bet</button><button>Auto</button></div></div><div class="amtbox"><button onclick="chg(2,-10)">−</button><input id="a2" value="20.00 KES"><button onclick="chg(2,10)">+</button></div><button class="betbtn green" id="btn2">Bet 20.00 KES</button><div class="quicks"><button>100</button><button>200</button><button>500</button><button>10000</button></div></div>
</div>
<script>
let canvas=document.getElementById('trail'),ctx=canvas.getContext('2d');
function resize(){let r=document.getElementById('gameBox').getBoundingClientRect();canvas.width=r.width*2;canvas.height=r.height*2;canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(2,0,0,2,0,0);}resize();window.addEventListener('resize',resize);
let mult=1,crash=0,timer=null,state='betting';
function randCrash(){let r=Math.random();if(r<0.5)return 1+Math.random()*1.8;if(r<0.85)return 1+Math.random()*10;return 10+Math.random()*90;}
function updateBG(m){
  let game=document.getElementById('gameBox');
  let rays=document.getElementById('rays');
  if(m<1.5){
    game.style.background='#000000';
    rays.style.background='repeating-conic-gradient(from -15deg at 0% 100%, #000 0deg 9deg, #111 9deg 18deg)';
  } else if(m<3){
    game.style.background='#0f0a1a';
    rays.style.background='repeating-conic-gradient(from -15deg at 0% 100%, #0f0a1a 0deg 9deg, #1a102a 9deg 18deg)';
  } else if(m<7){
    game.style.background='#1a0a2e';
    rays.style.background='repeating-conic-gradient(from -15deg at 0% 100%, #1a0a2e 0deg 9deg, #2a1050 9deg 18deg)';
  } else if(m<15){
    game.style.background='#2a0a3a';
    rays.style.background='repeating-conic-gradient(from -15deg at 0% 100%, #2a0a3a 0deg 9deg, #4a104a 9deg 18deg)';
  } else {
    game.style.background='#3d0a3d';
    rays.style.background='repeating-conic-gradient(from -15deg at 0% 100%, #3d0a3d 0deg 9deg, #6a1450 9deg 18deg)';
  }
}
function draw(m){
  let w=canvas.width/2,h=canvas.height/2;
  ctx.clearRect(0,0,w,h);
  if(state!=='flying')return;
  let prog=Math.min((m/crash)*0.88,0.88);
  let x=w*(prog*0.84);
  let y=h*(1 - prog*0.68 - Math.pow(prog,1.7)*0.28);
  ctx.beginPath();
  ctx.moveTo(0,h);
  let cpX=w*prog*0.35, cpY=h*(1-prog*0.18);
  ctx.quadraticCurveTo(cpX, cpY, x, y);
  ctx.strokeStyle='#ff0a1a';
  ctx.lineWidth=4;
  ctx.stroke();
  ctx.lineTo(x,h);
  ctx.lineTo(0,h);
  ctx.closePath();
  let grad=ctx.createLinearGradient(0,h,0,y);
  grad.addColorStop(0,'rgba(180,0,50,0.85)');
  grad.addColorStop(1,'rgba(180,0,50,0.1)');
  ctx.fillStyle=grad;
  ctx.fill();
  let pw=document.getElementById('planeWrap');
  pw.style.left=(x-12)+'px';
  pw.style.top=(y-20)+'px';
  pw.style.bottom='auto';
}
function startBetting(){
  state='betting';mult=1;
  document.getElementById('mult').innerText='1.00x';
  document.getElementById('mult').style.color='#fff';
  document.getElementById('planeWrap').style.left='0px';
  document.getElementById('planeWrap').style.top='auto';
  document.getElementById('planeWrap').style.bottom='4px';
  document.getElementById('planeWrap').style.opacity='1';
  ctx.clearRect(0,0,canvas.width,canvas.height);
  updateBG(1);
  setTimeout(()=>startFlying(),1000);
}
function startFlying(){
  state='flying';crash=randCrash();mult=1;
  timer=setInterval(()=>{
    mult+=0.018+mult*0.022;
    if(mult>=crash){doCrash();return;}
    document.getElementById('mult').innerText=mult.toFixed(2)+'x';
    updateBG(mult);
    draw(mult);
  },42);
}
function doCrash(){
  clearInterval(timer);
  state='crashed';
  document.getElementById('mult').innerText=crash.toFixed(2)+'x';
  document.getElementById('mult').style.color='#ff2a2a';
  document.getElementById('planeWrap').style.opacity='0';
  setTimeout(()=>startBetting(),2000);
}
startBetting();
function chg(p,d){let el=document.getElementById('a'+p);let v=parseFloat(el.value)||20;v=Math.max(10,v+d);el.value=v.toFixed(2)+' KES';}
</script>
</body>
</html>
