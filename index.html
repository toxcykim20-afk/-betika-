<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AVOX AVIATOR - Code Rain</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{background:#0e0e0e;color:#fff;max-width:430px;margin:0 auto;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#1a1a1a;padding:10px 8px;display:flex;gap:6px;align-items:center;border-radius:0 0 14px 14px}
.pill{padding:8px 18px;border-radius:20px;background:#2c2c2c;color:#888;border:none;font-weight:700;font-size:13px}
.pill.active{background:#3a3a3a;color:#fff}
.deposit{margin-left:auto;background:#000;color:#fff;padding:8px 16px;border-radius:20px;font-weight:900;border:1px solid #333;font-size:13px}
.tournament{margin:8px;background:linear-gradient(90deg,#1e162f,#221a36);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border:1px solid #2a2a4a}
.history{display:flex;gap:6px;padding:6px 8px;overflow-x:auto;white-space:nowrap}
.history span{padding:5px 10px;border-radius:15px;font-size:12px;font-weight:800}
.purple{color:#b07cff;background:#241538;border:1px solid #3a2a5a}.blue{color:#4ea8ff;background:#132e4a}.red{color:#ff5a5a;background:#3a1515}
.game{flex:1;margin:6px 8px;background:#000;border-radius:16px;position:relative;overflow:hidden;border:1px solid #222}
#rays{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 0% 100%, #000 0deg 10deg, #141414 10deg 20deg);opacity:0.9}
#trail{position:absolute;inset:0;width:100%;height:100%;z-index:1}
#codeRain{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.code{position:absolute;bottom:-20px;color:#00ff88;font-family:monospace;font-size:12px;font-weight:700;opacity:0.8;text-shadow:0 0 6px #00ff88;white-space:nowrap;animation:moveUp linear infinite}
@keyframes moveUp{0%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:1}90%{opacity:0.8}100%{transform:translateY(-110vh) translateX(20px);opacity:0}}
.logo{position:absolute;top:12px;left:14px;color:#e30613;font-style:italic;font-weight:900;font-size:24px;z-index:5}
#mult{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:62px;font-weight:900;z-index:3;letter-spacing:-1px;color:#fff;text-shadow:0 0 20px rgba(0,255,136,0.5)}
#msg{position:absolute;left:50%;top:64%;transform:translateX(-50%);font-size:12px;color:#aaa;z-index:3}
.bets{display:flex;gap:6px;padding:6px}
.panel{flex:1;background:#1e1e20;border-radius:14px;padding:8px;border:1px solid #2a2a2a}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tog{display:flex;background:#0f0f0f;border-radius:16px;padding:2px}
.tog button{padding:4px 10px;border-radius:14px;border:none;background:transparent;color:#666;font-size:11px;font-weight:700}
.tog button.on{background:#333;color:#fff}
.amtbox{display:flex;align-items:center;background:#0f0f0f;border-radius:20px;padding:3px;border:1px solid #333;margin-bottom:6px}
.amtbox button{width:26px;height:26px;border-radius:50%;border:none;background:#2a2a2a;color:#fff;font-size:16px}
.amtbox input{flex:1;background:transparent;border:none;color:#fff;text-align:center;font-weight:700;font-size:12px;outline:none}
.autocash input{width:100%;background:#0f0f0f;border:1px solid #333;border-radius:14px;padding:6px 8px;color:#fff;font-size:11px;text-align:center;margin-bottom:6px}
.betbtn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:900;font-size:13px;cursor:pointer}
.green{background:#00e701;color:#000;box-shadow:0 3px 0 #00a501}.yellow{background:#ffcc00;color:#000;box-shadow:0 3px 0 #b89300}.gray{background:#3a3a3a;color:#888}
.quicks{display:flex;gap:4px;margin-top:6px}
.quicks button{flex:1;padding:5px;border-radius:12px;background:#0f0f0f;border:1px solid #333;color:#888;font-size:11px}
</style>
</head>
<body>
<div class="topbar"><button class="pill active">Room 1</button><button class="pill">Room 2</button><button class="deposit">Deposit</button><span style="font-size:11px;color:#888;margin-left:6px" id="topBal">500 KES</span></div>
<div class="tournament"><div><b style="color:#ffeb3b;font-size:13px">🏆 TOURNAMENT</b><div style="font-size:11px;color:#aaa">Weekly prize pool 500,000 KES</div></div><div style="background:#2a2a3a;padding:10px 14px;border-radius:12px;color:#ffcc00;font-size:18px">→</div></div>
<div class="history" id="hist"><span class="purple">5.41x</span><span class="blue">1.23x</span><span class="purple">8.92x</span><span class="blue">2.07x</span><span class="red">12.45x</span><span class="blue">1.98x</span><span class="purple">3.64x</span><span class="blue">4.10x</span></div>
<div class="game" id="gameBox">
<div id="rays"></div>
<canvas id="trail"></canvas>
<div id="codeRain"></div>
<div class="logo">Aviator</div>
<div id="mult">1.00x</div>
<div id="msg">Place your bets</div>
</div>
<div class="bets">
<div class="panel">
<div class="head"><small id="bal1">500 KES</small><div class="tog"><button id="t1b" class="on" onclick="setMode(1,'bet')">Bet</button><button id="t1a" onclick="setMode(1,'auto')">Auto</button></div></div>
<div class="amtbox"><button onclick="chg(1,-10)">−</button><input id="a1" value="20.00 KES"><button onclick="chg(1,10)">+</button></div>
<div class="autocash"><input id="ac1" placeholder="Auto Cash Out 2.00"></div>
<button class="betbtn green" id="btn1" onclick="clickBet(1)">Bet 20.00 KES</button>
<div class="quicks"><button onclick="q(1,100)">100</button><button onclick="q(1,200)">200</button><button onclick="q(1,500)">500</button><button onclick="q(1,10000)">10000</button></div>
</div>
<div class="panel">
<div class="head"><small id="bal2">500 KES</small><div class="tog"><button id="t2b" class="on" onclick="setMode(2,'bet')">Bet</button><button id="t2a" onclick="setMode(2,'auto')">Auto</button></div></div>
<div class="amtbox"><button onclick="chg(2,-10)">−</button><input id="a2" value="20.00 KES"><button onclick="chg(2,10)">+</button></div>
<div class="autocash"><input id="ac2" placeholder="Auto Cash Out"></div>
<button class="betbtn green" id="btn2" onclick="clickBet(2)">Bet 20.00 KES</button>
<div class="quicks"><button onclick="q(2,100)">100</button><button onclick="q(2,200)">200</button><button onclick="q(2,500)">500</button><button onclick="q(2,10000)">10000</button></div>
</div>
</div>

<script>
let balance=500,state='betting',mult=1,crash=0,timer=null,betTimer=6,bets=[null,null],amounts=[20,20],modes=['bet','bet'],autoCash=[0,0];
let canvas=document.getElementById('trail'),ctx=canvas.getContext('2d'),gameBox=document.getElementById('gameBox'),rays=document.getElementById('rays'),multEl=document.getElementById('mult'),msgEl=document.getElementById('msg'),codeRain=document.getElementById('codeRain');
function resize(){let r=gameBox.getBoundingClientRect();canvas.width=r.width*2;canvas.height=r.height*2;canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(2,0,0,2,0,0);}window.addEventListener('resize',resize);resize();

const codes=["f(x)=x²","∑ x=1ⁿ","∫0^∞ e^-x","E=mc²","λ=0.72","if(x>2){win}","Math.random()","2.51x","12.45x","5.43x","x*1.5","crash()","return x*2","{code}","</>","0xFF","101010","y=mx+b","a²+b²=c²","π=3.14","x++","β=0.84","Δ=2.1","∞","//win","const win=mult*bet","let x=Math.pow()","=> {cashOut}"];
function createCode(){
 if(state!=='flying')return;
 let el=document.createElement('div');
 el.className='code';
 el.innerText=codes[Math.floor(Math.random()*codes.length)];
 el.style.left=Math.random()*85+'%';
 el.style.animationDuration=(2+Math.random()*3)+'s';
 el.style.color=['#00ff88','#00e5ff','#ffcc00','#ff5a5a','#b07cff'][Math.floor(Math.random()*5)];
 codeRain.appendChild(el);
 setTimeout(()=>el.remove(),4000);
}
setInterval(createCode,120);

function fmt(x){return x.toFixed(2)+' KES';}
function updateBal(){document.getElementById('bal1').innerText=balance.toFixed(0)+' KES';document.getElementById('bal2').innerText=balance.toFixed(0)+' KES';document.getElementById('topBal').innerText=balance.toFixed(2)+' KES';}
function randCrash(){let r=Math.random();if(r<0.5)return 1+Math.random()*1.8;if(r<0.85)return 2+Math.random()*8;return 10+Math.random()*90;}
function addHist(v){let h=document.getElementById('hist');let s=document.createElement('span');s.innerText=v.toFixed(2)+'x';s.className=v<2?'purple':v<10?'blue':'red';h.prepend(s);}
function setMode(p,m){modes[p-1]=m;document.getElementById('t'+p+'b').className=m==='bet'?'on':'';document.getElementById('t'+p+'a').className=m==='auto'?'on':'';}
function chg(p,d){amounts[p-1]=Math.max(10,amounts[p-1]+d);document.getElementById('a'+p).value=fmt(amounts[p-1]);if(!bets[p-1])document.getElementById('btn'+p).innerText='Bet '+fmt(amounts[p-1]);}
function q(p,v){amounts[p-1]=v;document.getElementById('a'+p).value=fmt(v);if(!bets[p-1])document.getElementById('btn'+p).innerText='Bet '+fmt(v);}
function clickBet(p){let i=p-1;if(state==='betting'){if(bets[i])return;if(balance<amounts[i]){alert('Low balance');return;}bets[i]={amt:amounts[i],cashed:false};balance-=amounts[i];updateBal();document.getElementById('btn'+p).innerText='Waiting...';document.getElementById('btn'+p).className='betbtn gray';autoCash[i]=parseFloat(document.getElementById('ac'+p).value)||0;}else if(state==='flying'&&bets[i]&&!bets[i].cashed){cashOut(p);}}
function cashOut(p){let i=p-1;if(!bets[i]||bets[i].cashed)return;let win=bets[i].amt*mult;balance+=win;bets[i].cashed=true;updateBal();document.getElementById('btn'+p).innerText='Won '+fmt(win);document.getElementById('btn'+p).className='betbtn green';msgEl.innerText='Cashed at '+mult.toFixed(2)+'x +'+fmt(win);setTimeout(()=>{bets[i]=null;if(state==='betting')resetBtn(p);},1200);}
function resetBtn(p){let i=p-1;if(bets[i])return;document.getElementById('btn'+p).innerText='Bet '+fmt(amounts[i]);document.getElementById('btn'+p).className='betbtn green';if(modes[i]==='auto'&&state==='betting')setTimeout(()=>clickBet(p),300);}
function updateBG(m){
 if(m<2){gameBox.style.background='#000';rays.style.background='repeating-conic-gradient(from 0deg at 0% 100%, #000 0deg 10deg, #141414 10deg 20deg)';multEl.style.color='#fff';}
 else if(m<5){gameBox.style.background='#120a1e';rays.style.background='repeating-conic-gradient(from 0deg at 0% 100%, #120a1e 0deg 10deg, #241538 10deg 20deg)';multEl.style.color='#fff';}
 else if(m<10){gameBox.style.background='#1e0a2e';rays.style.background='repeating-conic-gradient(from 0deg at 0% 100%, #1e0a2e 0deg 10deg, #3a1060 10deg 20deg)';multEl.style.color='#ffeb3b';}
 else{gameBox.style.background='#2a0a3a';rays.style.background='repeating-conic-gradient(from 0deg at 0% 100%, #2a0a3a 0deg 10deg, #5a1480 10deg 20deg)';multEl.style.color='#ff3b3b';}
}
function drawTrail(m){
 let w=canvas.width/2,h=canvas.height/2;ctx.clearRect(0,0,w,h);if(state!=='flying')return;
 let prog=Math.min((m/crash)*0.88,0.88);let x=w*(prog*0.86);let y=h*(1-prog*0.7-Math.pow(prog,1.6)*0.28);
 ctx.beginPath();ctx.moveTo(0,h);ctx.quadraticCurveTo(w*prog*0.35,h*(1-prog*0.18),x,y);ctx.strokeStyle='#e30613';ctx.lineWidth=4;ctx.stroke();
 ctx.lineTo(x,h);ctx.lineTo(0,h);ctx.closePath();let g=ctx.createLinearGradient(0,h,0,y);g.addColorStop(0,'rgba(227,6,19,0.9)');g.addColorStop(1,'rgba(227,6,19,0.1)');ctx.fillStyle=g;ctx.fill();
}
function startBetting(){state='betting';mult=1;ctx.clearRect(0,0,canvas.width,canvas.height);codeRain.innerHTML='';updateBG(1);multEl.innerText='1.00x';betTimer=6;msgEl.innerText='Place your bets - '+betTimer+'s';[1,2].forEach(p=>{let i=p-1;if(bets[i]&&bets[i].cashed)bets[i]=null;if(!bets[i])resetBtn(p);});let bt=setInterval(()=>{betTimer--;if(state!=='betting'){clearInterval(bt);return;}msgEl.innerText=betTimer>0?'Place your bets - '+betTimer+'s':'Taking off...';if(betTimer<=0){clearInterval(bt);startFlying();}},1000);}
function startFlying(){state='flying';crash=randCrash();mult=1;msgEl.innerText='Flying...';[1,2].forEach(p=>{if(bets[p-1]&&!bets[p-1].cashed){document.getElementById('btn'+p).innerText='Cash Out '+fmt(amounts[p-1]*mult);document.getElementById('btn'+p).className='betbtn yellow';}});timer=setInterval(()=>{mult+=0.018+mult*0.022;if(mult>=crash){doCrash();return;}multEl.innerText=mult.toFixed(2)+'x';updateBG(mult);drawTrail(mult);[1,2].forEach(p=>{let i=p-1;if(bets[i]&&!bets[i].cashed){document.getElementById('btn'+p).innerText='Cash Out '+fmt(amounts[i]*mult);if(autoCash[i]>0&&mult>=autoCash[i])cashOut(p);}});},45);}
function doCrash(){clearInterval(timer);state='crashed';multEl.innerText=crash.toFixed(2)+'x';multEl.style.color='#ff2a2a';msgEl.innerText='Flew away at '+crash.toFixed(2)+'x';addHist(crash);[1,2].forEach(p=>{let i=p-1;if(bets[i]&&!bets[i].cashed){document.getElementById('btn'+p).innerText='Lost • '+crash.toFixed(2)+'x';document.getElementById('btn'+p).className='betbtn gray';}});setTimeout(()=>{bets=[null,null];startBetting();},2500);}
updateBal();startBetting();
</script>
</body>
</html>
