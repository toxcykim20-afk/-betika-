<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AVOX AVIATOR - Moving Plane</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0a0a0a;color:#fff;max-width:430px;margin:0 auto;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#1e1e1e;padding:10px;display:flex;gap:6px;align-items:center}
.pill{padding:7px 16px;border-radius:20px;background:#2c2c2c;color:#777;border:none;font-weight:700;font-size:13px}
.pill.active{background:#3a3a3a;color:#fff}
.deposit{margin-left:auto;background:#ffcc00;color:#000;padding:7px 14px;border-radius:20px;font-weight:900;border:none}
.tournament{margin:8px;background:linear-gradient(90deg,#2a2142,#1a1a2e);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border:1px solid #333}
.history{display:flex;gap:5px;padding:4px 8px;overflow-x:auto}
.history span{padding:4px 9px;border-radius:12px;font-size:11px;font-weight:800;white-space:nowrap}
.purple{color:#c084fc;background:#2a1f3a;border:1px solid #3b2a5a}.blue{color:#60a5fa;background:#1a2e4a}.red{color:#f87171;background:#3a1f1f}
.game{flex:1;margin:8px;background:#000;border-radius:14px;position:relative;overflow:hidden;border:1px solid #222}
.rays{position:absolute;inset:0;background:repeating-conic-gradient(from 260deg at 10% 90%, #000 0deg 8deg, #111 8deg 16deg)}
#trail{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.logo{position:absolute;top:12px;left:12px;color:#e30613;font-style:italic;font-weight:900;font-size:22px;z-index:5}
#mult{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:58px;font-weight:900;z-index:3}
#msg{position:absolute;left:50%;top:62%;transform:translateX(-50%);font-size:12px;color:#aaa;z-index:3;white-space:nowrap}
#planeWrap{position:absolute;left:0;bottom:15%;z-index:4;width:68px;height:34px;transition:none}
.bets{display:flex;gap:6px;padding:6px}
.panel{flex:1;background:#1c1c1e;border-radius:14px;padding:8px;border:1px solid #2a2a2a}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tog{display:flex;background:#0f0f0f;border-radius:16px;padding:2px}
.tog button{padding:4px 10px;border-radius:14px;border:none;background:transparent;color:#666;font-size:11px;font-weight:700}
.tog button.on{background:#333;color:#fff}
.amtbox{display:flex;align-items:center;background:#0f0f0f;border-radius:20px;padding:3px;border:1px solid #333;margin-bottom:6px}
.amtbox button{width:26px;height:26px;border-radius:50%;border:none;background:#2a2a2a;color:#fff}
.amtbox input{flex:1;background:transparent;border:none;color:#fff;text-align:center;font-weight:700;font-size:12px;outline:none}
.autocash input{width:100%;background:#0f0f0f;border:1px solid #333;border-radius:14px;padding:6px 8px;color:#fff;font-size:11px;text-align:center;margin-bottom:6px}
.betbtn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:900;font-size:13px}
.green{background:#00e701;color:#000;box-shadow:0 3px 0 #00a501}.yellow{background:#ffcc00;color:#000;box-shadow:0 3px 0 #b89300}.gray{background:#3a3a3a;color:#888}
.quicks{display:flex;gap:4px;margin-top:6px}.quicks button{flex:1;padding:5px;border-radius:12px;background:#0f0f0f;border:1px solid #333;color:#888;font-size:10px}
@keyframes spin{0%{transform:scaleX(0.2)}50%{transform:scaleX(1)}100%{transform:scaleX(0.2)}}
.prop{animation:spin 0.06s linear infinite}
</style>
</head>
<body>
<div class="topbar"><button class="pill active">Room 1</button><button class="pill">Room 2</button><button class="deposit">+ Deposit</button></div>
<div class="tournament"><div><b style="color:#ffeb3b;font-size:12px">🏆 TOURNAMENT</b><div style="font-size:10px">Weekly prize pool 500,000 KES</div></div><div style="background:#333;padding:8px 12px;border-radius:10px;color:#ffcc00">→</div></div>
<div class="history" id="hist"><span class="purple">1.14x</span><span class="blue">3.43x</span><span class="purple">1.04x</span><span class="blue">3.21x</span><span class="red">28.59x</span></div>
<div class="game" id="gameBox">
<div class="rays"></div>
<canvas id="trail"></canvas>
<div class="logo">Aviator</div>
<div id="planeWrap">
<svg viewBox="0 0 200 80" width="68" height="34" xmlns="http://www.w3.org/2000/svg">
<path d="M10 45 L5 48 Q2 49 5 50 L30 52 C35 65 70 65 90 62 L180 55 Q190 53 190 42 Q190 32 180 32 L90 32 Q70 18 15 38 Z" fill="#E30613"/>
<ellipse cx="100" cy="28" rx="55" ry="9" fill="#E30613" transform="rotate(-8 100 28)"/>
<ellipse cx="105" cy="58" rx="50" ry="9" fill="#E30613" transform="rotate(-6 105 58)"/>
<path d="M100 35 Q110 30 125 32 L130 38 Q120 44 105 44 Z" fill="#fff"/>
<g class="prop"><ellipse cx="188" cy="42" rx="3" ry="24" fill="#ff3b3b"/></g>
</svg>
</div>
<div id="mult">1.00x</div>
<div id="msg">Place your bets - 6s</div>
</div>
<div class="bets">
<div class="panel">
<div class="head"><small id="bal1">500 KES</small><div class="tog"><button id="t1b" class="on" onclick="setMode(1,'bet')">Bet</button><button id="t1a" onclick="setMode(1,'auto')">Auto</button></div></div>
<div class="amtbox"><button onclick="chg(1,-10)">−</button><input id="a1" value="20.00 KES"><button onclick="chg(1,10)">+</button></div>
<div class="autocash"><input id="ac1" placeholder="Auto Cash Out 2.00x"></div>
<button class="betbtn green" id="btn1" onclick="clickBet(1)">Bet 20.00 KES</button>
<div class="quicks"><button onclick="q(1,10)">10</button><button onclick="q(1,100)">100</button><button onclick="q(1,200)">200</button><button onclick="q(1,500)">500</button></div>
</div>
<div class="panel">
<div class="head"><small id="bal2">500 KES</small><div class="tog"><button id="t2b" class="on" onclick="setMode(2,'bet')">Bet</button><button id="t2a" onclick="setMode(2,'auto')">Auto</button></div></div>
<div class="amtbox"><button onclick="chg(2,-10)">−</button><input id="a2" value="20.00 KES"><button onclick="chg(2,10)">+</button></div>
<div class="autocash"><input id="ac2" placeholder="Auto Cash Out"></div>
<button class="betbtn green" id="btn2" onclick="clickBet(2)">Bet 20.00 KES</button>
<div class="quicks"><button onclick="q(2,10)">10</button><button onclick="q(2,100)">100</button><button onclick="q(2,200)">200</button><button onclick="q(2,500)">500</button></div>
</div>
</div>
<script>
let balance=500,state='betting',mult=1,crash=0,timer=null,betTimer=6,bets=[null,null],amounts=[20,20],modes=['bet','bet'],autoCash=[0,0];
let canvas=document.getElementById('trail'),ctx=canvas.getContext('2d'),points=[];
function resize(){let r=document.getElementById('gameBox').getBoundingClientRect();canvas.width=r.width;canvas.height=r.height;}window.addEventListener('resize',resize);resize();
function fmt(x){return x.toFixed(2)+' KES';}
function updateBal(){document.getElementById('bal1').innerText=balance.toFixed(0)+' KES';document.getElementById('bal2').innerText=balance.toFixed(0)+' KES';}
function randCrash(){let r=Math.random();if(r<0.55)return 1+Math.random()*1.8;if(r<0.85)return 2+Math.random()*8;return 10+Math.random()*90;}
function addHist(v){let h=document.getElementById('hist');let s=document.createElement('span');s.innerText=v.toFixed(2)+'x';s.className=v<2?'purple':v<10?'blue':'red';h.prepend(s);}
function setMode(p,m){modes[p-1]=m;document.getElementById('t'+p+'b').className=m==='bet'?'on':'';document.getElementById('t'+p+'a').className=m==='auto'?'on':'';}
function chg(p,d){amounts[p-1]=Math.max(10,amounts[p-1]+d);document.getElementById('a'+p).value=fmt(amounts[p-1]);if(!bets[p-1])document.getElementById('btn'+p).innerText='Bet '+fmt(amounts[p-1]);}
function q(p,v){amounts[p-1]=v;document.getElementById('a'+p).value=fmt(v);if(!bets[p-1])document.getElementById('btn'+p).innerText='Bet '+fmt(v);}
function clickBet(p){let i=p-1;if(state==='betting'){if(bets[i])return;if(balance<amounts[i]){alert('Low balance');return;}bets[i]={amt:amounts[i],cashed:false};balance-=amounts[i];updateBal();document.getElementById('btn'+p).innerText='Waiting';document.getElementById('btn'+p).className='betbtn gray';autoCash[i]=parseFloat(document.getElementById('ac'+p).value)||0;}else if(state==='flying'&&bets[i]&&!bets[i].cashed){cashOut(p);}}
function cashOut(p){let i=p-1;if(!bets[i]||bets[i].cashed)return;let win=bets[i].amt*mult;balance+=win;bets[i].cashed=true;updateBal();document.getElementById('btn'+p).innerText='Won '+fmt(win);document.getElementById('btn'+p).className='betbtn green';document.getElementById('msg').innerText='Cashed at '+mult.toFixed(2)+'x +'+fmt(win);setTimeout(()=>{bets[i]=null;if(state==='betting')resetBtn(p);},1000);}
function resetBtn(p){let i=p-1;if(bets[i])return;document.getElementById('btn'+p).innerText='Bet '+fmt(amounts[i]);document.getElementById('btn'+p).className='betbtn green';if(modes[i]==='auto'&&state==='betting')setTimeout(()=>clickBet(p),200);}
function drawTrail(){ctx.clearRect(0,0,canvas.width,canvas.height);if(points.length<2)return;ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++){ctx.lineTo(points[i].x,points[i].y);}ctx.strokeStyle='#E30613';ctx.lineWidth=3;ctx.stroke();let grad=ctx.createLinearGradient(0,canvas.height,0,0);grad.addColorStop(0,'rgba(227,6,19,0.0)');grad.addColorStop(0.3,'rgba(227,6,19,0.4)');grad.addColorStop(1,'rgba(227,6,19,0.8)');ctx.lineTo(points[points.length-1].x,canvas.height);ctx.lineTo(points[0].x,canvas.height);ctx.closePath();ctx.fillStyle=grad;ctx.fill();}
function startBetting(){state='betting';mult=1;points=[];drawTrail();document.getElementById('mult').innerText='1.00x';document.getElementById('mult').style.color='#fff';document.getElementById('planeWrap').style.left='2%';document.getElementById('planeWrap').style.bottom='15%';document.getElementById('planeWrap').style.opacity='1';betTimer=6;document.getElementById('msg').innerText='Place bets - '+betTimer+'s';[1,2].forEach(p=>{let i=p-1;if(bets[i]&&bets[i].cashed)bets[i]=null;if(!bets[i])resetBtn(p);});let bt=setInterval(()=>{betTimer--;if(state!=='betting'){clearInterval(bt);return;}document.getElementById('msg').innerText=betTimer>0?'Place bets - '+betTimer+'s':'Taking off...';if(betTimer<=0){clearInterval(bt);startFlying();}},1000);}
function startFlying(){state='flying';crash=randCrash();mult=1;points=[{x:canvas.width*0.02,y:canvas.height*0.85}];document.getElementById('msg').innerText='Flying...';[1,2].forEach(p=>{if(bets[p-1]&&!bets[p-1].cashed){document.getElementById('btn'+p).innerText='Cash Out '+fmt(amounts[p-1]*mult);document.getElementById('btn'+p).className='betbtn yellow';}});timer=setInterval(()=>{mult+=0.015+mult*0.018;if(mult>=crash){doCrash();return;}document.getElementById('mult').innerText=mult.toFixed(2)+'x';let prog=Math.min((mult/crash)*0.92,0.92);let x=canvas.width*(0.02+prog*0.88);let y=canvas.height*(0.85-prog*0.70 - Math.pow(prog,2)*0.1);points.push({x,y});drawTrail();document.getElementById('planeWrap').style.left=(x-10)+'px';document.getElementById('planeWrap').style.bottom=(canvas.height-y-12)+'px';[1,2].forEach(p=>{let i=p-1;if(bets[i]&&!bets[i].cashed){document.getElementById('btn'+p).innerText='Cash Out '+fmt(amounts[i]*mult);if(autoCash[i]>0&&mult>=autoCash[i])cashOut(p);}});},50);}
function doCrash(){clearInterval(timer);state='crashed';document.getElementById('mult').innerText=crash.toFixed(2)+'x';document.getElementById('mult').style.color='#ff3b3b';document.getElementById('msg').innerText='Flew away at '+crash.toFixed(2)+'x';document.getElementById('planeWrap').style.opacity='0';addHist(crash);[1,2].forEach(p=>{let i=p-1;if(bets[i]&&!bets[i].cashed){document.getElementById('btn'+p).innerText='Lost • '+crash.toFixed(2)+'x';document.getElementById('btn'+p).className='betbtn gray';}});setTimeout(()=>{bets=[null,null];startBetting();},2500);}
updateBal();startBetting();
</script>
</body>
</html>
